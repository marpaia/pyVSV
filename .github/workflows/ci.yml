name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.6.7"
          enable-cache: true
      - name: Checkout Lab Compiler
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../MyersResearchGroup"
          git clone --depth 1 https://github.com/MyersResearchGroup/LabCompiler.git \
            "$GITHUB_WORKSPACE/../../MyersResearchGroup/LabCompiler"
      - name: Install locked dependencies
        run: uv sync --locked --group server
      - name: Check code and run tests
        run: make check
      - name: Build distributions
        run: make build
      - name: Smoke-test the wheel in an isolated environment
        run: |
          uv venv .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl
          .venv-wheel/bin/python -I -m vsv --version
          .venv-wheel/bin/vsv --help
