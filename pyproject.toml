[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vsv-bio"
version = "0.3.0"
description = "Computational genetics tools for Vesicular Stomatitis Virus (VSV) research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "lab-compiler",
    "sbol-utilities>=1.0a17",
    "sbol2>=1.4.1",
    "sbol3>=1.2.0.post0",
]

[tool.uv.sources]
lab-compiler = { path = "../../lab-lang/lab-py", editable = true }

[project.scripts]
vsv = "vsv.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]
server = [
    "fastapi>=0.124.2",
    "httpx2>=2.13",
    "uvicorn>=0.38.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vsv"]
exclude = ["/src/vsv/server"]

[tool.hatch.build.targets.wheel.force-include]
"ontology/synthetic-virology.ttl" = "vsv/synthetic-virology.ttl"
"data/raw/NC_001560.fasta" = "vsv/NC_001560.fasta"

# Editable installs keep the checkout on the path. The wheel omits vsv.server.
[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.vercel.scripts]
install = "uv sync --locked --no-dev --group server"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/ontology/synthetic-virology.ttl",
    "/data/raw/NC_001560.fasta",
    "/tests",
    "/README.md",
    "/CONTRIBUTING.md",
    "/Makefile",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = [
    "error",
    # Starlette's TestClient still references anyio.abc.BlockingPortal.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "sbol2",
    "sbol2.*",
    "sbol3",
    "sbol3.*",
    "sbol_utilities",
    "sbol_utilities.*",
]
ignore_missing_imports = true
