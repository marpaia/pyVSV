[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pyVSV"
version = "0.3.0"
description = "Computational genetics tools for Vesicular Stomatitis Virus (VSV) research."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["bioinformatics", "sbol", "vsv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.5.0",
    "rdflib>=6.1.1,<7",
    "sbol3>=1.2.0.post0",
]

[project.urls]
Homepage = "https://github.com/marpaia/pyVSV"
Documentation = "https://github.com/marpaia/pyVSV#readme"
Repository = "https://github.com/marpaia/pyVSV"
Issues = "https://github.com/marpaia/pyVSV/issues"

[project.scripts]
vsv = "vsv.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "twine>=6.2,<7",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/vsv"]

[tool.hatch.build.targets.wheel.force-include]
"ontology/synthetic-virology.ttl" = "vsv/synthetic-virology.ttl"
"data/raw/NC_001560.ttl" = "vsv/NC_001560.ttl"

# Editable installs keep the checkout on the path.
[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/src",
    "/ontology",
    "/data",
    "/docs",
    "/scripts",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/Makefile",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
    "sbol3",
    "sbol3.*",
]
ignore_missing_imports = true
